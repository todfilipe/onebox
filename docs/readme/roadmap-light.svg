<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title description">
  <title id="title">Roadmap do OneBox</title>
  <desc id="description">Linha temporal das fases zero a nove, da fundação ao deploy.</desc>
  <defs>
    <filter id="float" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0000002E"/>
    </filter>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .flow { stroke-dasharray: 10 18; animation: travel 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse { animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 10%, 100% { opacity: .35; } 44%, 72% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .flow { stroke-dashoffset: 0; }
      .pulse { opacity: 1; }
    }
    
  </style>
  <rect width="1400" height="430" fill="#FFFFFF"/>
  <text x="70" y="82" fill="#1D1D1F" font-size="34" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Construído por fases.</text>
          <text x="70" y="118" fill="#6E6E73" font-size="16" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Cada camada foi validada antes de receber a seguinte.</text>
          <path d="M110 240 H1290" stroke="#D2D2D7" stroke-width="4" stroke-linecap="round"/>
          <path d="M110 240 H1290" stroke="#0071E3" stroke-width="4" stroke-linecap="round"/>
          <g>
                <circle cx="110" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="110" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">0</text>
                <text x="110" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Fundação</text>
              </g><g>
                <circle cx="241.11111111111111" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="241.11111111111111" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">1</text>
                <text x="241.11111111111111" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Contas</text>
              </g><g>
                <circle cx="372.22222222222223" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="372.22222222222223" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">2</text>
                <text x="372.22222222222223" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Dados</text>
              </g><g>
                <circle cx="503.33333333333337" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="503.33333333333337" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">3</text>
                <text x="503.33333333333337" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Pipeline</text>
              </g><g>
                <circle cx="634.4444444444445" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="634.4444444444445" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">4</text>
                <text x="634.4444444444445" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Inbox</text>
              </g><g>
                <circle cx="765.5555555555555" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="765.5555555555555" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">5</text>
                <text x="765.5555555555555" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Email</text>
              </g><g>
                <circle cx="896.6666666666667" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="896.6666666666667" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">6</text>
                <text x="896.6666666666667" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Escrita</text>
              </g><g>
                <circle cx="1027.7777777777778" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="1027.7777777777778" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">7</text>
                <text x="1027.7777777777778" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Regras</text>
              </g><g>
                <circle cx="1158.888888888889" cy="240" r="17" fill="#FFFFFF" stroke="#0071E3" stroke-width="3"/>
                <text x="1158.888888888889" y="246" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">8</text>
                <text x="1158.888888888889" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Pesquisa</text>
              </g><g>
                <circle cx="1290" cy="240" r="24" fill="#0071E3" stroke="#0071E3" stroke-width="3"/>
                <text x="1290" y="246" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">9</text>
                <text x="1290" y="294" fill="#1D1D1F" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Deploy</text>
              </g>
          <rect x="1016" y="344" width="314" height="46" rx="23" fill="#F5F5F7" stroke="#D2D2D7"/>
          <text x="1173" y="373" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">10 fases · MVP em produção</text>
</svg>
