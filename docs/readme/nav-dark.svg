<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="96" viewBox="0 0 1400 96" role="img" aria-labelledby="title description">
  <title id="title">Navegação do OneBox</title>
  <desc id="description">Barra de navegação com o símbolo e o nome OneBox.</desc>
  <defs>
    <filter id="float" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000A6"/>
    </filter>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .flow { stroke-dasharray: 10 18; animation: travel 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse { animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 10%, 100% { opacity: .35; } 44%, 72% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .flow { stroke-dashoffset: 0; }
      .pulse { opacity: 1; }
    }
    
  </style>
  <rect width="1400" height="96" fill="#000000"/>
  <rect width="1400" height="96" fill="#1E1E20E8"/>
        <g transform="translate(72 27) scale(1)">
    <rect width="42" height="42" rx="12" fill="#0A84FF"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8v26"/><path d="M10 13h5c2.5 0 4 1.5 4 4v5"/>
      <path d="M32 13h-5c-2.5 0-4 1.5-4 4v5"/><path d="M11 27h5l3 5h4l3-5h5"/>
    </g>
  </g>
        <text x="130" y="59" fill="#F5F5F7" font-size="22" font-weight="600" text-anchor="start" letter-spacing="-0.012em">OneBox</text>
        <text x="1328" y="58" fill="#2997FF" font-size="15" font-weight="500" text-anchor="end" letter-spacing="-0.016em">oneboxai.me</text>
</svg>
