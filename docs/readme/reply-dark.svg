<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">Responde em segundos</title>
  <desc id="description">Cartão de resposta sugerida com controlos para ajustar o tom antes do envio.</desc>
  <defs>
    <filter id="float" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000A6"/>
    </filter>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .flow { stroke-dasharray: 10 18; animation: travel 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse { animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 10%, 100% { opacity: .35; } 44%, 72% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .flow { stroke-dashoffset: 0; }
      .pulse { opacity: 1; }
    }
    
  </style>
  <rect width="1400" height="720" fill="#000000"/>
  <text x="80" y="94" fill="#2997FF" font-size="17" font-weight="600" text-anchor="start" letter-spacing="-0.016em">Resposta sugerida</text>
        <text x="80" y="145" fill="#F5F5F7" font-size="40" font-weight="600" text-anchor="start" letter-spacing="-0.022em">O rascunho já está pronto.</text>
        <g filter="url(#float)">
    <rect x="80" y="200" width="1240" height="430" rx="28" fill="#1D1D1F" stroke="#3A3A3C"/>
    
          <g>
            <text x="128" y="256" fill="#A1A1A6" font-size="15" font-weight="500" text-anchor="start" letter-spacing="-0.016em">Ajustar tom</text>
            <rect x="128" y="280" width="132" height="40" rx="20" fill="#1D1D1F" stroke="#3A3A3C"/>
                  <text x="194" y="306" fill="#F5F5F7" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Mais formal</text><rect x="272" y="280" width="126" height="40" rx="20" fill="#0A84FF" stroke="#0A84FF"/>
                  <text x="335" y="306" fill="#FFFFFF" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Mais curta</text><rect x="410" y="280" width="152" height="40" rx="20" fill="#1D1D1F" stroke="#3A3A3C"/>
                  <text x="486" y="306" fill="#F5F5F7" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Mais simpática</text><rect x="574" y="280" width="130" height="40" rx="20" fill="#1D1D1F" stroke="#3A3A3C"/>
                  <text x="639" y="306" fill="#F5F5F7" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Mais direta</text>
          </g>
          <rect x="128" y="350" width="1144" height="190" rx="16" fill="#000000" stroke="#3A3A3C"/>
          <text x="164" y="397" fill="#F5F5F7" font-size="17" font-weight="400" letter-spacing="-0.016em"><tspan x="164" dy="0">Olá Ana,</tspan><tspan x="164" dy="28.9">Confirmado: o novo valor e o prazo de novembro funcionam.</tspan><tspan x="164" dy="28.9">Filipe</tspan></text>
          <rect x="1084" y="560" width="188" height="48" rx="24" fill="#0A84FF"/>
          <text x="1178" y="590" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">Rever e enviar</text>
        
  </g>
</svg>
