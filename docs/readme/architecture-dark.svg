      .group { font-size: 12px; font-weight: 500; letter-spacing: 0.006em; fill: #86868B; }
      .step { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .card { fill: #1D1D1F; stroke: rgba(255,255,255,0.12); }
      .area { fill: none; stroke: rgba(255,255,255,0.12); }
      .main { fill: none; stroke: #0A84FF; stroke-width: 2; stroke-linecap: round; marker-end: url(#head-main); }
      .other { fill: none; stroke: #86868B; stroke-width: 1.5; stroke-linecap: round; marker-end: url(#head-other); }
      .icon { fill: none; stroke: #86868B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
