<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1216" viewBox="0 0 960 1216" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do OneBox</title>
  <desc id="desc">Diagrama de arquitetura do OneBox. O browser mostra a interface Next.js. Num VPS com Docker e nginx com TLS correm a app Next.js, com App Router, Auth.js com Google, rotas de API e server actions, e o n8n, com o workflow pipeline Gmail e o workflow de renovação do watch, à segunda às 4h; do n8n só o caminho /webhook/* é público e o editor usa-se por túnel SSH. No Google Cloud estão o OAuth, a Gmail API e o Pub/Sub. A Gemini API fica à parte. No Supabase estão o Postgres, com as tabelas users, email_accounts, emails e category_rules, tokens OAuth cifrados com AES-256-GCM e Row Level Security, e o Realtime na tabela emails. Caminho de um email novo: 1, a Gmail publica no Pub/Sub a notificação do watch da conta; 2, o Pub/Sub faz push para o webhook do n8n, que verifica o token OIDC; 3, o n8n decifra o refresh token da conta e pede as mensagens novas à Gmail API com history.list; 4, a Gemini devolve resumo, resposta sugerida e importância; 5, o n8n aplica as regras do utilizador por cima da importância da IA e grava o email no Postgres; 6, o Realtime publica a nova linha da tabela emails; 7, o browser recebe o evento, que o RLS filtra pelo utilizador do JWT de 1 hora assinado pela app, e atualiza a inbox. Outras ligações: o browser fala com a app por HTTPS; a app usa o OAuth para entrar e ligar contas, a Gmail API para registar o watch e enviar respostas, a Gemini para ajustar o tom das respostas e o Postgres com a service role.</desc>
