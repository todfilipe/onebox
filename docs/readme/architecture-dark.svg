      <path d="M4 2.5 10 6 4 9.5" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="head-other" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M4.5 3 10 6 4.5 9" fill="none" stroke="#86868B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="browser" viewBox="0 0 20 20"><g class="icon"><rect x="2" y="3.5" width="16" height="13" rx="3"/><path d="M2 7.5h16"/></g></symbol>
    <symbol id="app" viewBox="0 0 20 20"><g class="icon"><rect x="2" y="3.5" width="16" height="13" rx="3"/><path d="M8 8 6 10l2 2M12 8l2 2-2 2"/></g></symbol>
    <symbol id="workflow" viewBox="0 0 20 20"><g class="icon"><circle cx="4.5" cy="10" r="2"/><circle cx="15.5" cy="4.5" r="2"/><circle cx="15.5" cy="15.5" r="2"/><path d="M6.5 9.2 13.5 5.3M6.5 10.8l7 3.9"/></g></symbol>
    <symbol id="lock" viewBox="0 0 20 20"><g class="icon"><rect x="4" y="9" width="12" height="8.5" rx="2"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></g></symbol>
    <symbol id="mail" viewBox="0 0 20 20"><g class="icon"><rect x="2.5" y="4.5" width="15" height="11" rx="2"/><path d="m3.5 6 6.5 5 6.5-5"/></g></symbol>
    <symbol id="broadcast" viewBox="0 0 20 20"><g class="icon"><circle cx="10" cy="10" r="1.5"/><path d="M6.5 6.5a5 5 0 0 0 0 7M13.5 6.5a5 5 0 0 1 0 7M4 4a8.5 8.5 0 0 0 0 12M16 4a8.5 8.5 0 0 1 0 12"/></g></symbol>
    <symbol id="chip" viewBox="0 0 20 20"><g class="icon"><rect x="5" y="5" width="10" height="10" rx="2"/><path d="M8 2.5V5M12 2.5V5M8 15v2.5M12 15v2.5M2.5 8H5M2.5 12H5M15 8h2.5M15 12h2.5"/></g></symbol>
    <symbol id="database" viewBox="0 0 20 20"><g class="icon"><ellipse cx="10" cy="5" rx="6.5" ry="2.5"/><path d="M3.5 5v10c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5V5M3.5 10c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5"/></g></symbol>
    <symbol id="bolt" viewBox="0 0 20 20"><g class="icon"><path d="M11 2.5 4.5 11H10l-1 6.5L15.5 9H10z"/></g></symbol>
