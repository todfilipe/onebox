  <g>
    <circle cx="59" cy="976" r="11" fill="#0071E3"/><text class="step" x="59" y="980" text-anchor="middle">1</text>
    <text class="body" x="82" y="981">A Gmail publica no Pub/Sub a notificação do watch() da conta.</text>
    <circle cx="59" cy="1006" r="11" fill="#0071E3"/><text class="step" x="59" y="1010" text-anchor="middle">2</text>
    <text class="body" x="82" y="1011">O Pub/Sub faz push para o webhook do n8n, que verifica o token OIDC.</text>
    <circle cx="59" cy="1036" r="11" fill="#0071E3"/><text class="step" x="59" y="1040" text-anchor="middle">3</text>
    <text class="body" x="82" y="1041">O n8n decifra o refresh token da conta e pede as mensagens novas com history.list.</text>
