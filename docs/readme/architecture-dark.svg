    <text class="body" x="82" y="1101">As regras do utilizador sobrepõem-se à importância da IA e o email é gravado.</text>
    <circle cx="59" cy="1126" r="11" fill="#0071E3"/><text class="step" x="59" y="1130" text-anchor="middle">6</text>
    <text class="body" x="82" y="1131">O Realtime publica a nova linha da tabela emails.</text>
    <circle cx="59" cy="1156" r="11" fill="#0071E3"/><text class="step" x="59" y="1160" text-anchor="middle">7</text>
    <text class="body" x="82" y="1161">O browser recebe o evento, que o RLS filtra pelo sub do JWT, e atualiza a inbox.</text>
