<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">A IA lê primeiro</title>
  <desc id="description">Um email é transformado num resumo de uma linha e numa classificação de importância.</desc>
  <defs>
    <filter id="float" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000A6"/>
    </filter>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .flow { stroke-dasharray: 10 18; animation: travel 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse { animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 10%, 100% { opacity: .35; } 44%, 72% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .flow { stroke-dashoffset: 0; }
      .pulse { opacity: 1; }
    }
    
  </style>
  <rect width="1400" height="720" fill="#000000"/>
  <g filter="url(#float)">
    <rect x="80" y="120" width="560" height="480" rx="28" fill="#1D1D1F" stroke="#3A3A3C"/>
    
          <g transform="translate(124 164)" fill="none" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect width="30" height="21.599999999999998" y="4.2" rx="4"/>
    <path d="M2 7.199999999999999 L15 15.600000000000001 L28 7.199999999999999"/>
  </g>
          <text x="174" y="181" fill="#A1A1A6" font-size="15" font-weight="500" text-anchor="start" letter-spacing="-0.016em">Email recebido</text>
          <text x="124" y="244" fill="#F5F5F7" font-size="26" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Proposta revista para sexta</text>
          <text x="124" y="286" fill="#A1A1A6" font-size="15" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Ana Marques · 09:24</text>
          <text x="124" y="354" fill="#F5F5F7" font-size="17" font-weight="400" letter-spacing="-0.016em"><tspan x="124" dy="0">Olá Filipe, segue a versão revista da proposta.</tspan><tspan x="124" dy="26.35">Preciso da tua confirmação até sexta para fechar</tspan><tspan x="124" dy="26.35">o orçamento e manter o prazo de novembro.</tspan></text>
        
  </g>
        <path d="M640 360 H760" fill="none" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" class="flow"/>
        <circle cx="700" cy="360" r="24" fill="#0A84FF"/>
        <text x="700" y="367" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="-0.016em">IA</text>
        <g filter="url(#float)">
    <rect x="760" y="120" width="560" height="480" rx="28" fill="#1D1D1F" stroke="#3A3A3C"/>
    
          <text x="804" y="181" fill="#2997FF" font-size="15" font-weight="600" text-anchor="start" letter-spacing="-0.016em">Lido antes de abrir</text>
          <text x="804" y="244" fill="#F5F5F7" font-size="22" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Resumo</text>
          <text x="804" y="286" fill="#F5F5F7" font-size="18" font-weight="400" letter-spacing="-0.016em"><tspan x="804" dy="0">Precisa da tua confirmação até sexta</tspan><tspan x="804" dy="27.900000000000002">e anexa o orçamento final.</tspan></text>
          <text x="804" y="392" fill="#A1A1A6" font-size="15" font-weight="500" text-anchor="start" letter-spacing="-0.016em">Importância</text>
          <rect x="804" y="416" width="126" height="42" rx="21" fill="#1D1D1F" stroke="#3A3A3C"/>
          <circle cx="829" cy="437" r="5" fill="#FF453A"/>
          <text x="851" y="443" fill="#F5F5F7" font-size="15" font-weight="600" text-anchor="start" letter-spacing="-0.016em">Alta</text>
          <text x="804" y="520" fill="#A1A1A6" font-size="15" font-weight="500" text-anchor="start" letter-spacing="-0.016em">Resposta sugerida pronta</text>
          <path d="M804 546 H1208" stroke="#3A3A3C"/>
        
  </g>
</svg>
