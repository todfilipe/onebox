<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do OneBox</title>
  <desc id="description">Diagrama com Next.js, Auth.js, Supabase, Gmail API, Pub/Sub, n8n, Gemini e o VPS Hetzner.</desc>
  <defs>
    <filter id="float" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0000002E"/>
    </filter>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .flow { stroke-dasharray: 10 18; animation: travel 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse { animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 10%, 100% { opacity: .35; } 44%, 72% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .flow { stroke-dashoffset: 0; }
      .pulse { opacity: 1; }
    }
    
  </style>
  <rect width="1400" height="760" fill="#FFFFFF"/>
  <text x="70" y="82" fill="#1D1D1F" font-size="34" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Como é feito.</text>
        <text x="70" y="118" fill="#6E6E73" font-size="16" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Produto, dados e automação com responsabilidades separadas.</text>
        <rect x="60" y="150" width="1280" height="540" rx="32" fill="#F5F5F7"/>
        <text x="92" y="190" fill="#6E6E73" font-size="14" font-weight="600" text-anchor="start" letter-spacing="-0.016em">VPS Hetzner · Docker</text>
        <g>
    <rect x="100" y="230" width="220" height="112" rx="20" fill="#0071E3" stroke="#0071E3"/>
    <text x="124" y="276" fill="#FFFFFF" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Next.js</text>
    <text x="124" y="306" fill="#FFFFFF" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Interface e API</text>
  </g>
        <g>
    <rect x="100" y="410" width="220" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="124" y="456" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Auth.js</text>
    <text x="124" y="486" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">OAuth Google</text>
  </g>
        <g>
    <rect x="460" y="230" width="220" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="484" y="276" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Supabase</text>
    <text x="484" y="306" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">RLS e Realtime</text>
  </g>
        <g>
    <rect x="460" y="410" width="220" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="484" y="456" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Gmail API</text>
    <text x="484" y="486" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">watch e history</text>
  </g>
        <g>
    <rect x="820" y="230" width="220" height="112" rx="20" fill="#0071E3" stroke="#0071E3"/>
    <text x="844" y="276" fill="#FFFFFF" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">n8n</text>
    <text x="844" y="306" fill="#FFFFFF" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Pipeline</text>
  </g>
        <g>
    <rect x="820" y="410" width="220" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="844" y="456" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Gemini</text>
    <text x="844" y="486" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Resumo e resposta</text>
  </g>
        <g>
    <rect x="1110" y="320" width="170" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="1134" y="366" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Pub/Sub</text>
    <text x="1134" y="396" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Eventos push</text>
  </g>
        <path d="M320 286 H460" stroke="#D2D2D7" stroke-width="2"/>
        <path d="M320 466 H390 V342 H460" fill="none" stroke="#D2D2D7" stroke-width="2"/>
        <path d="M680 466 H750 V286 H820" fill="none" stroke="#D2D2D7" stroke-width="2"/>
        <path d="M1040 286 H1110 V376" fill="none" stroke="#D2D2D7" stroke-width="2"/>
        <path d="M1110 376 H1074 V466 H1040" fill="none" stroke="#D2D2D7" stroke-width="2"/>
        <path d="M820 466 H750 V342 H680" fill="none" stroke="#0071E3" stroke-width="3" class="flow"/>
        <path d="M460 286 H390 V286 H320" fill="none" stroke="#0071E3" stroke-width="3" class="flow"/>
        <text x="700" y="650" fill="#6E6E73" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="-0.016em">Realtime entrega cada email sem refrescar a página</text>
</svg>
