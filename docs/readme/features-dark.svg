<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title description">
  <title id="title">Funcionalidades do dia a dia</title>
  <desc id="description">Três cartões mostram pesquisa global, arquivo e adiados, e regras pessoais.</desc>
  <defs>
    <filter id="float" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000A6"/>
    </filter>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .flow { stroke-dasharray: 10 18; animation: travel 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse { animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 10%, 100% { opacity: .35; } 44%, 72% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .flow { stroke-dashoffset: 0; }
      .pulse { opacity: 1; }
    }
    
  </style>
  <rect width="1400" height="600" fill="#000000"/>
  <text x="70" y="82" fill="#F5F5F7" font-size="34" font-weight="600" text-anchor="start" letter-spacing="-0.012em">O resto do que precisas.</text>
          <g filter="url(#float)">
    <rect x="70" y="130" width="370" height="390" rx="28" fill="#1D1D1F" stroke="#3A3A3C"/>
    
              <circle cx="124" cy="190" r="30" fill="#1D1D1F" stroke="#3A3A3C"/>
              <g transform="translate(113 179)" fill="none" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></g>
              <text x="112" y="284" fill="#F5F5F7" font-size="25" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Pesquisa</text>
              <text x="112" y="317" fill="#F5F5F7" font-size="25" font-weight="600" text-anchor="start" letter-spacing="-0.012em">em todas as contas</text>
              <text x="112" y="382" fill="#A1A1A6" font-size="16" font-weight="400" letter-spacing="-0.016em"><tspan x="112" dy="0">Procura no assunto, remetente</tspan><tspan x="112" dy="24.8">e resumo ao mesmo tempo.</tspan></text>
            
  </g><g filter="url(#float)">
    <rect x="490" y="130" width="370" height="390" rx="28" fill="#1D1D1F" stroke="#3A3A3C"/>
    
              <circle cx="544" cy="190" r="30" fill="#1D1D1F" stroke="#3A3A3C"/>
              <g transform="translate(533 179)" fill="none" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="9"/><path d="M11 6v5l4 2"/></g>
              <text x="532" y="284" fill="#F5F5F7" font-size="25" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Arquivo e adiados</text>
              <text x="532" y="317" fill="#F5F5F7" font-size="25" font-weight="600" text-anchor="start" letter-spacing="-0.012em">sem perder o fio</text>
              <text x="532" y="382" fill="#A1A1A6" font-size="16" font-weight="400" letter-spacing="-0.016em"><tspan x="532" dy="0">O email volta à inbox</tspan><tspan x="532" dy="24.8">à hora que escolheste.</tspan></text>
            
  </g><g filter="url(#float)">
    <rect x="910" y="130" width="370" height="390" rx="28" fill="#1D1D1F" stroke="#3A3A3C"/>
    
              <circle cx="964" cy="190" r="30" fill="#1D1D1F" stroke="#3A3A3C"/>
              <g transform="translate(953 179)" fill="none" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round"><path d="M1 7h10M17 7h6M1 17h4M11 17h12"/><circle cx="14" cy="7" r="3"/><circle cx="8" cy="17" r="3"/></g>
              <text x="952" y="284" fill="#F5F5F7" font-size="25" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Regras pessoais</text>
              <text x="952" y="317" fill="#F5F5F7" font-size="25" font-weight="600" text-anchor="start" letter-spacing="-0.012em">sempre primeiro</text>
              <text x="952" y="382" fill="#A1A1A6" font-size="16" font-weight="400" letter-spacing="-0.016em"><tspan x="952" dy="0">Remetente, domínio ou palavra.</tspan><tspan x="952" dy="24.8">A tua decisão prevalece.</tspan></text>
            
  </g>
</svg>
