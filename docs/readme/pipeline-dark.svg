<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Do Gmail à inbox do OneBox</title>
  <desc id="desc">Um email da Marta Correia chega a duas contas Gmail do mesmo utilizador, pessoal.teste@gmail.com (P) e trabalho.teste@gmail.com (T). O Gmail avisa o Google Pub/Sub, que faz push para o webhook do n8n. O n8n confirma que o token OIDC foi assinado pela Google, identifica a conta, busca a mensagem com history.list e messages.get e pede à Gemini resumo, resposta e importância. A Gemini sugere Média, que fica riscada: a regra do utilizador para o remetente marta.correia@empresa.pt ganha e define Alta. O email é gravado no Supabase e o Realtime avisa o browser, sem refrescar. Na inbox aparecem duas linhas, uma por conta, com a etiqueta Alta e o resumo: Antecipou a reunião para as 9h30 e pede confirmação.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .title { font-size: 17px; font-weight: 600; letter-spacing: -0.022em; }
    .body { font-size: 15px; letter-spacing: -0.016em; }
    .strong { font-weight: 600; }
    .medium { font-weight: 500; }
    .meta { font-size: 13px; letter-spacing: -0.006em; }
    .label { font-size: 12px; font-weight: 500; letter-spacing: 0.006em; }
    .hide { opacity: 0; }
    .second { transform: translateY(64px); }

    .a { animation-duration: 16s; animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); animation-iteration-count: infinite; animation-fill-mode: both; }
    .late { animation-delay: 0.16s; }
    .twin { animation-delay: 0.24s; }
    .idle { animation-name: idle; }
    .arrive { animation-name: arrive; }
    .gmailP { animation-name: gmailP; }
    .gmailT { animation-name: gmailT; }
    .pubsub { animation-name: pubsub; }
    .push { animation-name: push; }
    .scan { animation-name: scan; }
    .oidc { animation-name: oidc; }
    .account { animation-name: account; }
    .suggest { animation-name: suggest; }
    .rule { animation-name: rule; }
    .overruled { animation-name: overruled; }
    .store { animation-name: store; }
    .supabase { animation-name: supabase; }
    .notify { animation-name: notify; }
    .realtime { animation-name: realtime; }
    .deliver { animation-name: deliver; }
    .older { animation-name: older; }
    .insertT { animation-name: insertT; }
    .insertP { animation-name: insertP; }

    @keyframes idle { 0%, 6.25% { opacity: 1; } 8.25%, 98% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes arrive { 0%, 6.25% { opacity: 0; } 8.25%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes gmailP { 0%, 11.25% { opacity: 0; transform: translateX(0); } 12.25% { opacity: 1; } 16.25% { opacity: 1; transform: translateX(124px); } 17.25%, 100% { opacity: 0; transform: translateX(124px); } }
    @keyframes gmailT { 0%, 11.25% { opacity: 0; transform: translateX(0); } 12.25% { opacity: 1; } 16.25% { opacity: 1; transform: translateX(-124px); } 17.25%, 100% { opacity: 0; transform: translateX(-124px); } }
    @keyframes pubsub { 0%, 16% { opacity: 0; } 17.5%, 20% { opacity: 1; } 22%, 100% { opacity: 0; } }
    @keyframes push { 0%, 18% { opacity: 0; transform: translateY(0); } 18.75% { opacity: 1; } 20.5% { opacity: 1; transform: translateY(28px); } 21.25%, 100% { opacity: 0; transform: translateY(28px); } }
    @keyframes scan { 0%, 21% { opacity: 0; transform: translateY(0); } 22.5%, 25.5% { opacity: 1; transform: translateY(0); } 27%, 30% { transform: translateY(36px); } 31.5%, 36.5% { transform: translateY(72px); } 38%, 44% { opacity: 1; transform: translateY(108px); } 45.5%, 100% { opacity: 0; transform: translateY(108px); } }
    @keyframes oidc { 0%, 23% { opacity: 0; } 24.5%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes account { 0%, 27.5% { opacity: 0; } 29%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes suggest { 0%, 33% { opacity: 0; } 34.5%, 42.5% { opacity: 1; } 44%, 100% { opacity: 0; } }
    @keyframes rule { 0%, 38.5% { opacity: 0; } 40%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes overruled { 0%, 42.5% { opacity: 0; } 44%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes store { 0%, 45.5% { opacity: 0; transform: translateY(0); } 46.25% { opacity: 1; } 47.75% { opacity: 1; transform: translateY(20px); } 48.5%, 100% { opacity: 0; transform: translateY(20px); } }
    @keyframes supabase { 0%, 47.5% { opacity: 0; } 49%, 51.5% { opacity: 1; } 53.5%, 100% { opacity: 0; } }
    @keyframes notify { 0%, 50.5% { opacity: 0; transform: translateX(0); } 51.25% { opacity: 1; } 53% { opacity: 1; transform: translateX(44px); } 53.75%, 100% { opacity: 0; transform: translateX(44px); } }
    @keyframes realtime { 0%, 52.5% { opacity: 0; } 54%, 56.5% { opacity: 1; } 58.5%, 100% { opacity: 0; } }
    @keyframes deliver { 0%, 55% { opacity: 0; transform: translateY(0); } 55.75% { opacity: 1; } 57.25% { opacity: 1; transform: translateY(20px); } 58%, 100% { opacity: 0; transform: translateY(20px); } }
    @keyframes older { 0%, 58% { opacity: 1; transform: translateY(0); } 60%, 61.5% { transform: translateY(64px); } 63.5% { opacity: 1; transform: translateY(128px); } 97.9% { opacity: 0; transform: translateY(128px); } 98% { opacity: 0; transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes insertT { 0%, 58% { opacity: 0; transform: translateY(-12px); } 60%, 61.5% { opacity: 1; transform: translateY(0); } 63.5%, 96% { opacity: 1; transform: translateY(64px); } 98%, 100% { opacity: 0; transform: translateY(64px); } }
    @keyframes insertP { 0%, 61.5% { opacity: 0; transform: translateY(-12px); } 63.5%, 96% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; }
    }
  </style>
