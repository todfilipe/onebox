<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
  <title id="title">Pipeline de processamento do OneBox</title>
  <desc id="description">Duas contas Gmail enviam eventos para o n8n, a Gemini resume, as regras pessoais prevalecem e o email chega classificado à inbox.</desc>
  <defs>
    <filter id="float" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0000002E"/>
    </filter>
    
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', Inter, system-ui, sans-serif; }
    .flow { stroke-dasharray: 10 18; animation: travel 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .pulse { animation: pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes travel { 0% { stroke-dashoffset: 140; } 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 10%, 100% { opacity: .35; } 44%, 72% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .flow { stroke-dashoffset: 0; }
      .pulse { opacity: 1; }
    }
    
  </style>
  <rect width="1400" height="520" fill="#FFFFFF"/>
  <text x="70" y="80" fill="#1D1D1F" font-size="34" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Do email novo à inbox organizada</text>
        <text x="70" y="116" fill="#6E6E73" font-size="16" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Uma pipeline orientada a eventos, sem polling.</text>
        <g>
    <rect x="70" y="190" width="170" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="94" y="236" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Gmail</text>
    <text x="94" y="266" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Contas A e B</text>
  </g>
        <g>
    <rect x="280" y="190" width="170" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="304" y="236" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Pub/Sub</text>
    <text x="304" y="266" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Evento push</text>
  </g>
        <g>
    <rect x="490" y="190" width="170" height="112" rx="20" fill="#0071E3" stroke="#0071E3"/>
    <text x="514" y="236" fill="#FFFFFF" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">n8n</text>
    <text x="514" y="266" fill="#FFFFFF" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Orquestra</text>
  </g>
        <g>
    <rect x="700" y="190" width="170" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="724" y="236" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Gemini</text>
    <text x="724" y="266" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Resume e sugere</text>
  </g>
        <g>
    <rect x="910" y="190" width="190" height="112" rx="20" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="934" y="236" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Regras</text>
    <text x="934" y="266" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Ganham à IA</text>
  </g>
        <g>
    <rect x="1140" y="190" width="190" height="112" rx="20" fill="#0071E3" stroke="#0071E3"/>
    <text x="1164" y="236" fill="#FFFFFF" font-size="20" font-weight="600" text-anchor="start" letter-spacing="-0.012em">Inbox</text>
    <text x="1164" y="266" fill="#FFFFFF" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">Já classificado</text>
  </g>
        <path d="M240 246 H280" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" class="flow"/>
        <path d="M450 246 H490" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" class="flow"/>
        <path d="M660 246 H700" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" class="flow"/>
        <path d="M870 246 H910" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" class="flow"/>
        <path d="M1100 246 H1140" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" class="flow"/>
        <g class="pulse">
          <rect x="918" y="350" width="404" height="86" rx="20" fill="#F5F5F7" stroke="#D2D2D7"/>
          <text x="946" y="384" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="start" letter-spacing="-0.016em">Prioridade determinística</text>
          <text x="946" y="412" fill="#6E6E73" font-size="14" font-weight="400" text-anchor="start" letter-spacing="-0.016em">A escolha do utilizador é aplicada por último.</text>
        </g>
</svg>
