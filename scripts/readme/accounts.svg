<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Todas as contas, uma caixa</title>
  <desc id="desc">Duas contas Gmail, pessoal e trabalho, ligam-se à mesma inbox. À direita, a lista mostra a marca da conta em cada linha, com os filtros Todas as contas, Todos, Alta, Média e Baixa.</desc>
  <defs>
    <filter id="float" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="520">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="{{shadow}}"/>
    </filter>
    <clipPath id="screen">
      <rect x="344" y="99" width="560" height="322" rx="20"/>
    </clipPath>
  </defs>
  <rect width="960" height="520" rx="28" fill="{{bgAlt}}"/>

  <g font-family="{{font}}">
    <rect x="48" y="174" width="272" height="56" rx="18" fill="{{bg}}" stroke="{{hairline}}"/>
    <circle cx="72" cy="202" r="10" fill="none" stroke="{{hairline}}"/>
    <text x="72" y="206" text-anchor="middle" font-size="12" font-weight="500" letter-spacing="0.006em" fill="{{secondary}}">P</text>
    <text x="90" y="206" font-size="13" letter-spacing="-0.006em" fill="{{text}}">pessoal.teste@gmail.com</text>

    <rect x="48" y="254" width="272" height="56" rx="18" fill="{{bg}}" stroke="{{hairline}}"/>
    <circle cx="72" cy="282" r="10" fill="none" stroke="{{hairline}}"/>
    <text x="72" y="286" text-anchor="middle" font-size="12" font-weight="500" letter-spacing="0.006em" fill="{{secondary}}">T</text>
    <text x="90" y="286" font-size="13" letter-spacing="-0.006em" fill="{{text}}">trabalho.teste@gmail.com</text>

    <circle cx="72" cy="335" r="8" fill="none" stroke="{{hairline}}" stroke-dasharray="2 2"/>
    <path d="M68,335 h8 M72,331 v8" stroke="{{secondary}}" stroke-width="1.3" stroke-linecap="round"/>
    <text x="88" y="339" font-size="13" letter-spacing="-0.006em" fill="{{secondary}}">Adicionar conta</text>

    <path d="M320,202 C332,202 332,121 336,121" fill="none" stroke="{{secondary}}" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M320,282 C332,282 332,121 336,121" fill="none" stroke="{{secondary}}" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <rect x="336" y="91" width="576" height="338" rx="28" fill="{{bg}}" filter="url(#float)"/>
  <rect x="336.5" y="91.5" width="575" height="337" rx="27.5" fill="none" stroke="{{hairline}}"/>
  <image href="{{image:docs/readme/shots/accounts-{theme}.png}}" x="344" y="99" width="560" height="322" clip-path="url(#screen)"/>
</svg>
