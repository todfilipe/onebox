<svg xmlns="http://www.w3.org/2000/svg" width="960" height="644" viewBox="0 0 960 644" role="img" aria-labelledby="title desc">
  <title id="title">O resto do que precisas</title>
  <desc id="desc">Três cartões sobre pesquisa em todas as contas, arquivo e adiados, e regras de categorização. O primeiro mostra dois resultados para «fatura» encontrados no assunto, no remetente e no resumo. O segundo mostra dois emails arquivados com etiqueta de importância baixa. O terceiro mostra três regras, por remetente, por domínio e por palavra-chave desativada, cada uma a forçar uma importância à frente da IA.</desc>
  <defs>
    <filter id="cardShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="644">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="{{glassShadow}}"/>
    </filter>
    <clipPath id="clipSearch">
      <rect x="56" y="108" width="848" height="135.37" rx="12"/>
    </clipPath>
    <clipPath id="clipArchived">
      <rect x="56" y="335.37" width="404" height="119.25" rx="12"/>
    </clipPath>
    <clipPath id="clipRules">
      <rect x="500" y="335.37" width="404" height="236.59" rx="12"/>
    </clipPath>
  </defs>

  <rect width="960" height="644" rx="28" fill="{{bgAlt}}"/>

  <g font-family="{{font}}">
    <rect x="48" y="48" width="864" height="203.37" rx="20" fill="{{bg}}" filter="url(#cardShadow)"/>
    <rect x="48.5" y="48.5" width="863" height="202.37" rx="19.5" fill="none" stroke="{{hairline}}"/>
    <g transform="translate(68,68)" fill="none" stroke="{{text}}" stroke-width="1.5" stroke-linecap="round">
      <circle cx="11" cy="11" r="6.5"/>
      <path d="m16 16 4 4"/>
    </g>
    <text x="102" y="85" font-size="17" font-weight="600" letter-spacing="-0.022em" fill="{{text}}">Pesquisa em todas as contas</text>
    <image href="{{image:docs/readme/shots/search-{theme}.png}}" x="56" y="108" width="848" height="135.37" clip-path="url(#clipSearch)"/>

    <rect x="48" y="275.37" width="420" height="304.59" rx="20" fill="{{bg}}" filter="url(#cardShadow)"/>
    <rect x="48.5" y="275.87" width="419" height="303.59" rx="19.5" fill="none" stroke="{{hairline}}"/>
    <g transform="translate(68,295.37)" fill="none" stroke="{{text}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.5V12l3 2"/>
    </g>
    <text x="102" y="312.37" font-size="17" font-weight="600" letter-spacing="-0.022em" fill="{{text}}">Arquivo e adiados</text>
    <image href="{{image:docs/readme/shots/archived-{theme}.png}}" x="56" y="335.37" width="576.01" height="119.25" clip-path="url(#clipArchived)"/>

    <rect x="492" y="275.37" width="420" height="304.59" rx="20" fill="{{bg}}" filter="url(#cardShadow)"/>
    <rect x="492.5" y="275.87" width="419" height="303.59" rx="19.5" fill="none" stroke="{{hairline}}"/>
    <g transform="translate(512,295.37)" fill="none" stroke="{{text}}" stroke-width="1.5" stroke-linecap="round">
      <path d="M4 8h10M18 8h2M4 16h4M12 16h8"/>
      <circle cx="16" cy="8" r="2"/>
      <circle cx="10" cy="16" r="2"/>
    </g>
    <text x="546" y="312.37" font-size="17" font-weight="600" letter-spacing="-0.022em" fill="{{text}}">As tuas regras ganham sempre</text>
    <image href="{{image:docs/readme/shots/rules-{theme}.png}}" x="500" y="335.37" width="404" height="236.59" clip-path="url(#clipRules)"/>
  </g>
</svg>
